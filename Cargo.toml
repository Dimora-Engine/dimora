[workspace]
resolver = "2"
members = [
    "crates/engine-math",
    "crates/engine-core",
    "crates/engine-world",
    "crates/engine-assets",
    "crates/engine-renderer",
    "crates/engine-animation",
    "crates/engine-renderer-wgpu",
    "crates/engine-platform",
    "crates/engine",
    "examples/basic_2_5d",
    "examples/spatial_scene",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Minimum supported Rust version. Verified by building and running `cargo test --workspace --locked` on exactly
# 1.90.0 (see TASKS.md). The floor comes from the locked dependency graph: `ordered-float 5.5.0` (via wgpu-hal on
# Linux and Windows) requires 1.90, and cargo 1.89 refuses that graph.
rust-version = "1.90"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
engine-math = { path = "crates/engine-math" }
engine-core = { path = "crates/engine-core" }
engine-world = { path = "crates/engine-world" }
engine-assets = { path = "crates/engine-assets" }
engine-animation = { path = "crates/engine-animation" }
engine-renderer = { path = "crates/engine-renderer" }
engine-renderer-wgpu = { path = "crates/engine-renderer-wgpu" }
engine-platform = { path = "crates/engine-platform" }
engine = { path = "crates/engine" }
log = "0.4"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
