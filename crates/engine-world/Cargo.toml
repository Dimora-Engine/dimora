[package]
name = "engine-world"
description = "ECS world, resources, schedule and the spatial transform hierarchy."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
engine-math.workspace = true
hecs = "0.10"
log.workspace = true
# Geometric queries only. Features are the set ADR-0025 verified: no spade, rayon, simd8, or
# enhanced-determinism. Parry types stay inside this crate.
parry3d = { version = "0.31.1", default-features = false, features = ["dim3", "f32", "std", "alloc"] }
